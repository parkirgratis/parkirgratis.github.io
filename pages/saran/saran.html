<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saran dan Kritik - Parkir Gratis</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../img/logo.png" />
    <link rel="stylesheet" href="saran.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=REM&family=Poppins:wght@400;600&display=swap">
</head>
<body class="bg-[#222831] text-white min-h-screen flex flex-col">
    <header class="title-prop border-b border-white fixed top-0 left-0 w-full backdrop-blur-xl bg-black/60 md:text-3xl sm:text-2xl text-xl font-bold text-center mb-12 pb-10 py-3 px-4 flex flex-col items-center justify-center gap-2">
        <div class="flex items-center gap-2">
            Berikan Saran Anda
            <span>
                <img src="https://media.tenor.com/iRCGgt_NkvkAAAAi/amelia-watson-hololive.gif" width="40" alt="Icon" loading="lazy">
            </span>
        </div>
        <p class="text-center text-xs md:text-sm mt-20 bg-white px-3 py-1 rounded-lg text-violet-500 animated-text">
            Saran anda dapat membantu kami dalam mengembangkan website ini menjadi lebih baik dan sesuai dengan kebutuhan anda!
        </p>
    </header>    
    
    <main class="flex-grow md:px-40 px-1 pb-16">
        <div class="content container mx-auto pt-32 p-10 lg:px-32 sm:px-20 px-10">
            <form id="saranForm" class="bg-white p-6 rounded-lg shadow-lg">
                <div class="flex justify-center mb-4">
                    <img src="../../img/logo_landing.png" class="w-24" alt="Logo" loading="lazy">
                </div>
                <div class="space-y-4">
                    <div class="form-group">
                        <label for="nama" class="block text-lg font-semibold pb-2 text-slate-500">Nama:</label>
                        <input type="text" id="nama" required class="w-full p-3 rounded bg-slate-200 text-gray-700 focus:ring-2 focus:ring-blue-500 transition-all" placeholder="Masukkan nama Anda...">
                    </div>
                    
                    <div class="form-group">
                        <label for="gmail" class="block text-lg font-semibold pb-2 text-slate-500">Alamat Email:</label>
                        <input type="email" id="gmail" required class="w-full p-3 rounded bg-slate-200 text-gray-700 focus:ring-2 focus:ring-blue-500 transition-all" placeholder="Masukkan email Anda...">
                    </div>
                
                    <div class="form-group">
                        <label for="saran" class="block text-lg font-semibold pb-2 text-slate-500">Saran dan Kritik:</label>
                        <textarea id="saran" required class="w-full p-3 rounded bg-slate-200 text-gray-700 h-40 focus:ring-2 focus:ring-blue-500 transition-all" placeholder="Tulis saran Anda di sini..."></textarea>
                    </div>

                    <div class="form-group" hidden>
                        <label for="tanggal" class="block text-lg font-semibold pb-2 text-slate-500">Tanggal:</label>
                        <input type="date" id="tanggal" required class="w-full p-3 rounded bg-slate-200 text-gray-700 focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                </div>

                <div class="flex gap-4 justify-center items-center mt-6">
                    <button type="submit" class="bg-blue-500 hover:bg-blue-800 text-white font-semibold py-2 px-6 rounded transition transform duration-300 ease-in-out hover:scale-110 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Kirim
                    </button>
                    <a href="../../index.html" class="bg-red-500 hover:bg-red-800 text-white font-semibold py-2 px-6 rounded transition transform duration-300 ease-in-out hover:scale-110 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                        Kembali
                    </a>
                </div>
            </form>
        </div>
    </main>

    <footer class="backdrop-blur-lg bg-black/50 text-center">
        <div class="bg-black/5 pt-3 text-lg flex justify-center items-center gap-2 text-white">
            <img src="../../img/logo.png" alt="Footer Logo" class="mr-2 w-10" loading="lazy">
            <p class="pb-1 border-2 border-transparent border-l-gray-500 px-3">Developed by 
                <a class="pb-1 bg-clip-text text-transparent bg-gradient-to-r from-[#6454F0] to-[#6EE2F5] font-semibold hover:from-[#6EE2F5] hover:to-[#6454F0] transition-all" href="../aboutus/aboutus.html#team">
                    Team Parkir Gratis
                </a>
            </p>
        </div>
        <div class="flex justify-center items-center pb-2 gap-3">
            <a href="https://www.instagram.com/parkirgratis.bdg" class="text-white hover:opacity-80 transition-opacity" target="_blank" rel="noopener noreferrer">
                <img src="https://static.vecteezy.com/system/resources/previews/019/874/344/non_2x/instagram-apps-icon-free-png.png" width="30" alt="Instagram" loading="lazy">
            </a>
            <a href="https://www.tiktok.com/@parkirgratis.bdg" class="text-white hover:opacity-80 transition-opacity" target="_blank" rel="noopener noreferrer">
                <img src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/tiktok-round-white-icon.png" width="30" alt="TikTok" loading="lazy">
            </a>
        </div>
        <div class="pb-3">
            <p class="text-white text-center text-sm">
                <a href="../aboutus/aboutus.html" class="hover:text-sky-500 border border-transparent border-r-gray-500 pr-2">Tentang Kami</a>
                © 2024 All Rights Reserved
            </p>
        </div>
    </footer>

    <script type="module" src="saran.js"></script>
</body>
</html>
